name: Trivy Security Scan

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trivy-fs:
    uses: dxworks/pipelines/.github/workflows/trivy-fs-scan.yml@2a87ba006a2a2747196fd292376bda880f672c6e

  trivy-image:
    uses: dxworks/pipelines/.github/workflows/trivy-image-scan.yml@2a87ba006a2a2747196fd292376bda880f672c6e
    with:
      image-ref: inspector-git-test:latest
      build-context: '.'
      build-setup: './mvnw clean package -q'
      java-version: '21'
      post-pr-comment: true
