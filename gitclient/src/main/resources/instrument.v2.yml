name: inspector-git
id: inspector-git
version: 1.6.0

actions:
  verify:
    with:
      requirements:
        - name: Java 21+
          min: 21.0.0
          command: java -version
          match:
            - 'version "(?<version>.+)"'
        - name: git 2.12+
          min: 2.12.0
          command: git --version
          match:
            - 'git version (?<version>.+)'
        - name: Python 3.9+
          min: 3.9.0
          command:
            windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 --version) else (python --version)
            unix: if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
          match:
            - 'Python (?<version>.+)'
  start:
    parameters:
      igFlags: ''
    environment:
      IG_IGLOG: false
    commands:
      extract-iglogs:
        id: extract-iglogs
        dir: ${instrumentPath}
        command: >-
          java -jar iglog.jar "${repo}" ${igFlags}

  summary:
    md-file: results/summary.md
    html-file: results/summary.html
    category: Git History
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 ig-summary.py "${instrumentPath}/results") else (python ig-summary.py "${instrumentPath}/results")
          unix: if command -v python3 >/dev/null 2>&1; then python3 ig-summary.py "${instrumentPath}/results"; else python ig-summary.py "${instrumentPath}/results"; fi

  clean:
    with:
      locations:
        - source: ${instrumentDir}/results

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
